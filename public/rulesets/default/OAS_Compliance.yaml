rules:
  - id: "BAS-110-01-2507-2507-M"
    title: The API description file complies with Swagger 2.0 or OpenAPI 3.0.x.
    option: Mandatory
    message: The specification must use Swagger 2.0 or OpenAPI 3.0.x.
    location: file
    element: version
    call:
      function: checkOASVersion
      functionParams:
        allowedVersions:
          - "2.0"
          - "3.0"
    description: This rule checks the format version independently of info.version. Swagger accepts "2.0" or numeric 2; OpenAPI requires a full 3.0.<patch> string. Shortened or numeric OpenAPI versions are not supported.
    status: implemented
    severity: critical

  - id: "BAS-110-01-2507-2507-M-1"
    title: The API description file follows the Swagger 2.0 or OpenAPI 3.0 structure
    option: Mandatory
    message: The deliverables must meet the specifications and must be checked in the tool. Complying with the YAML interface definition design specifications for cloud services.
    location: file
    element: all
    call:
      function: checkOASSpec
      functionParams:
        allowExtensions: true
        checkDuplicateMethods: true
        formats:
          swagger:
            requiredValues:
              - swagger
              - info
              - paths
            optionalValues:
              - host
              - basePath
              - schemes
              - consumes
              - produces
              - definitions
              - parameters
              - responses
              - securityDefinitions
              - security
              - tags
              - externalDocs
          openapi:
            requiredValues:
              - openapi
              - info
              - paths
            optionalValues:
              - servers
              - security
              - tags
              - externalDocs
              - components
    description: This rule checks the root object and its own top-level fields against the template for the supported specification format. Root x- extensions are allowed when allowExtensions is true; other unknown or cross-format fields are rejected. When checkDuplicateMethods is true, inspect original YAML/JSON Path Item declarations, including local refs and YAML aliases/merges, and report repeated HTTP method keys once per affected path with declaration lines. Do not rewrite the specification or block other rules; runtime last-value-wins behavior is preserved. This is not a full validation of nested OpenAPI objects.
    status: implemented
    severity: critical
