rules:
  - id: "COD-020-01-2507-2507-M"
    title: "Content-Type: Default Media Type"
    message: "Each request or response body must declare at least one application/json or application/bson media type."
    option: Mandatory
    location: paths
    call:
      function: checkContentType
      functionParams:
        methods:
          - "post"
          - "put"
          - "delete"
        direction: both
        allowedMediaTypes:
          - application/json
          - application/bson
    description: Check native consumes, produces and content declarations. Additional representations are allowed; their order does not define a default.
    severity: high
    status: implemented

  - id: "COD-020-01-2507-2507-M-1"
    title: "Content-Type: Default Media Type not present for GET requests"
    message: "If the request body is absent, the default media type header must not be set."
    option: Mandatory
    location: paths
    call:
      function: checkParamElementAbsence
      functionParams:
        whenRequestBodyAbsent: true
        methods:
          - "get"
        headers:
          - name: "Content-Type"
            valueType: string
            in: header
    severity: high
    status: implemented