rules:
  - id: "QUE-040-01-2507-2507-M"
    title: "The total number of resources that meet the query conditions is returned when the resource list is queried."
    message: The API response must include the total number of matching resources using the field 'count'.
    option: Mandatory
    description: Check native response schemas for the configured method and status, preferring exact application/json then the first media. Retain array and field-name/type policies; no-body responses are skipped, but a declared body without a selected schema cannot verify count.
    location: paths
    element: responses
    call:
      function: checkResponseIncludesCount
      functionParams:
        method: "get"
        pathMustNotContainPathParams: false
        responseCode: "200"
        responseContainArray: true
        fieldName: "count"
        fieldType: "integer"
        required: true
        allowedNames:
          - "count"
        disallowedNames:
          - "total"
          - "total_count"
    severity: high
    status: implemented

  - id: "QUE-050-01-2507-2507-M"
    title: "Cloud services must provide APIs for querying their own service quotas."
    message: Service must expose a quota query endpoint like GET /v1/quotas.
    option: Mandatory
    description: Check that a real native quota operation exists, including local Path Item references. Preserve configured path and method matching, excluding unrelated paths before reference resolution.
    location: paths
    element: path
    call:
      function: checkQuotaApiPresence
      functionParams:
        pathPattern: "/quotas"
        method: "get"
    severity: high
    status: implemented

  - id: "QUE-060-01-2507-2507-M"
    title: "Querying resource details requires returning creation and modification time parameters"
    message: Resource detail query APIs must return the time fields required by the matching profile, or the configured creation time fields and, when updates are supported, modification time fields.
    option: Mandatory
    description: Check native response schemas, preserving project-only and tags exclusions, aliases and nested field traversal. The first matching timeFieldProfiles entry replaces the default time fields and identifier filter. Match resourceKeywords case-insensitively as whole hyphen/underscore-delimited words in the last literal path segment, ignoring path parameters. Ancestor segments and partial words do not match. Every field in the profile requiredFields must be declared in the selected response schema, independently of PUT/PATCH, but need not be mandatory or non-null in response values. Without a matching profile, creation time fields are required and modification time fields are required only when PUT or PATCH exists on the same resource collection or its immediate parameterized item path. Parameter names and trailing slashes do not affect update matching. Parent, child and unrelated resources, and POST actions, do not imply update support. No-body responses are skipped; a declared body without a selected schema cannot verify the time fields.
    location: paths
    element: responses
    call:
      function: checkTimeFieldsInDetailQuery
      functionParams:
        method: "get"
        pathMustContainPathParameter: "id"
        responseCode: "200"
        requiredFields:
          - "created_at"
          - "updated_at"
        timeFieldProfiles:
          - resourceKeywords:
              - "task"
              - "tasks"
              - "job"
              - "jobs"
            requiredFields:
              - "start_time"
              - "end_time"
    severity: high
    status: implemented
