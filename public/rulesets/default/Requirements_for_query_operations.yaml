rules:
  - id: "QUE-040-01-2507-2507-M"
    title: "The total number of resources that meet the query conditions is returned when the resource list is queried."
    message: The API response must include the total number of matching resources using the field 'count'.
    option: Mandatory
    description: Check native response schemas for the configured method and status, preferring exact application/json then the first media. Retain array and field-name/type policies; no-body responses are skipped, but a declared body without a selected schema cannot verify count.
    location: paths
    element: responses
    call:
      function: checkResponseIncludesCount
      functionParams:
        method: "get"
        pathMustNotContainPathParams: false
        responseCode: "200"
        responseContainArray: true
        fieldName: "count"
        fieldType: "integer"
        required: true
        allowedNames:
          - "count"
        disallowedNames:
          - "total"
          - "total_count"
    severity: high
    status: implemented

  - id: "QUE-050-01-2507-2507-M"
    title: "Cloud services must provide APIs for querying their own service quotas."
    message: Service must expose a quota query endpoint like GET /v1/quotas.
    option: Mandatory
    description: Checks that a service exposes a quota query endpoint, e.g. GET /v1/quotas.
    location: paths
    element: path
    call:
      function: checkQuotaApiPresence
      functionParams:
        pathPattern: "/quotas"
        method: "get"
    severity: high
    status: implemented

  - id: "QUE-060-01-2507-2507-M"
    title: "Querying resource details requires returning creation and modification time parameters"
    message: Resource detail query APIs must return 'create_time' and 'update_time' fields in the response.
    option: Mandatory
    description: Check native response schemas for detail endpoints, preserving identifier matching, project-only and tags exclusions, aliases and nested field traversal. No-body responses are skipped; a declared body without a selected schema cannot verify the time fields.
    location: paths
    element: responses
    call:
      function: checkTimeFieldsInDetailQuery
      functionParams:
        method: "get"
        pathMustContainPathParameter: "id"
        responseCode: "200"
        requiredFields:
          - "create_time"
          - "update_time"
          - "created_at"
          - "updated_at"
    severity: high
    status: implemented
