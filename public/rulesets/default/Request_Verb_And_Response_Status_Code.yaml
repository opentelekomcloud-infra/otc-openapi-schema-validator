rules:
  - id: "STC-010-01-2507-2507-M-1"
    title: Complete CRUD Support for Created Resources
    message: |
      Each resource-creating path (POST) must have corresponding GET, PUT and DELETE operations for the same resource.
    option: Mandatory
    location: paths
    element: path
    call:
      function: checkCRUD
      functionParams: 
        createMethod: 
          - "post"
        requiredMethods:
          - "get"
          - "put"
          - "delete"
    description: This rule checks whether each resource creation operation (POST) has all related CRUD operations (GET, PUT, DELETE).
    status: implemented
    severity: high
  
  - id: "STC-010-01-2507-2507-M-2"
    title: GET operations must return 200 on success
    message: |
      All GET operations must return status code 200 (OK) on success.
    option: Mandatory
    location: paths
    element: responses
    call:
      function: checkSuccessResponse
      functionParams:
        method: "get"
        requiredStatusCode: "200"
    description: Check status code for successfully GET operation. It should be 200.
    status: implemented
    severity: critical

  - id: "STC-010-01-2507-2507-M-3"
    title: GET operations must be secure and idempotent
    message: |
      GET operations must not modify server-side data or state. They must not have a request body or have action keywords in path.
    option: Mandatory
    location: paths
    element: get
    call:
      function: checkGetIdempotency
      functionParams:
        disallowedPathKeywords:
          - "create"
          - "update"
          - "delete"
          - "restart"
          - "trigger"
          - "action"
          - "execute"
          - "run"
          - "reset"
          - "change"
        disallowRequestBody: true
    description: Check native GET body/formData parameters or requestBody references and the configured path keyword substrings. No conversion or MIME assumption is required.
    status: implemented
    severity: critical

  - id: "STC-010-01-2507-2507-M-4"
    title: GET single resource must return an object
    message: |
      GET requests that return a single resource must not return a list or array. The top-level schema type must be object.
    option: Mandatory
    location: paths
    element:
      - responses
    call:
      function: checkGetReturnObject
      functionParams:
        method: get
        requiredResponseType: object
        requiredPathRegexp:
          - "^.*id}$"
    description: Check native response schemas for all 2xx bodies and media types, including reusable responses and local schema references. No-body responses are skipped; an announced body without a schema fails the check.
    status: implemented
    severity: critical

  - id: "STC-010-01-2507-2507-M-5"
    title: GET list operations must return an array
    message: |
      GET methods used to retrieve a list of resources must return a top-level array (e.g. []).
    option: Mandatory
    location: paths
    element:
      - responses
    call:
      function: checkGetReturnObject
      functionParams:
        method: get
        requiredResponseType: array
        requiredPathRegexp:
          - ".*/[^/]*s$"
        exceptionPathRegexp:
          - "^.*status$"
    description: Check native response schemas for all 2xx bodies, retaining the existing array-like wrapper and plural-required fallback heuristics. This is not strict top-level-array-only validation or new allOf type inference.
    status: implemented
    severity: critical
    