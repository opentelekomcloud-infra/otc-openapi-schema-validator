rules:
  - id: "BAS-080-01-2507-2507-M"
    title: "Compatibility: The interfaces must be compatible"
    description: This rule compares whether any API call has been deleted when comparing to previous version of OpenAPI specification.
    message: |
      The API is deleted
    option: Mandatory
    location: paths
    element: path
    call:
      function: checkCompatibility
      functionParams:
        methods:
          - "get"
          - "put"
          - "post"
          - "patch"
          - "delete"
    status: implemented
    severity: critical

  - id: "BAS-080-01-2507-2507-M-1"
    title: "Compatibility: The interfaces must be compatible"
    description: This rule compares whether any API request or response parameter has been deleted when comparing to previous version of OpenAPI specification.
    message: |
      The API request or response parameter is deleted.
    option: Mandatory
    location: paths
    element:
      - requestBody
      - responses
    call:
      function: checkCompatibility
    status: implemented
    severity: critical

  - id: "BAS-080-01-2507-2507-M-2"
    title: "Compatibility: The interfaces must be compatible"
    description: This rule compares whether any required or optional request body properties have been added to existing API calls when comparing to the native baseline specification.
    message: |
      Adding request body properties to APIs.
    option: Mandatory
    location: paths
    element: requestBody
    call:
      function: checkCompatibility
    status: implemented
    severity: critical

  - id: "BAS-080-01-2507-2507-M-3"
    title: "Compatibility: The interfaces must be compatible"
    description: This rule compares whether the request and response body parameter types are same for same parameters.
    message: |
      The API request or response parameter types are incompatible.
    option: Mandatory
    location: paths
    element:
      - requestBody
      - responses
    call:
      function: checkCompatibility
    status: implemented
    severity: critical

  - id: "BAS-080-01-2507-2507-M-4"
    title: "Compatibility: The interfaces must be compatible"
    description: This rule compares whether the value range in enum type has been changed when comparing to previous OpenAPI specification
    message: |
      The value range of the API request parameter is narrowed down.
    option: Mandatory
    location: paths
    element:
      - requestBody
      - responses
    call:
      function: checkCompatibility
    status: implemented
    severity: critical

  - id: "BAS-080-01-2507-2507-M-5"
    title: "Compatibility: The interfaces must be compatible"
    description: This rule compares whether status code of API response has been deleted or modified when comparing to previous OpenAPI specification
    message: |
      The API response status code is deleted or changed.
    option: Mandatory
    location: paths
    element:
      - responses
    call:
      function: checkCompatibility
    status: implemented
    severity: critical

  - id: "BAS-080-01-2507-2507-M-6"
    title: "Compatibility: The interfaces must be compatible"
    description: This rule reports response header names added or removed compared to the native baseline specification. Names are case-insensitive; header schema and type changes are not compared.
    message: |
      Modify or delete a response header.
    option: Mandatory
    location: paths
    element:
      - responses
    call:
      function: checkCompatibility
    status: implemented
    severity: critical
