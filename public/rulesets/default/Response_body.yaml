rules:
  - id: "COD-040-01-2507-2507-M"
    title: "Response Body JSON, BSON, XML or Octet-Stream Encapsulation"
    message: "The response body must support JSON, BSON, XML or Octet-Stream encapsulation."
    description: Check native produces or response.content, not an explicit Content-Type header parameter. Excluded request media skip the operation; excluded response media skip that response. A body without declared media cannot satisfy the rule; no-body responses are skipped.
    option: Mandatory
    location: paths
    element: responses
    call:
      function: checkResponseEncapsulation
      functionParams:
        content:
          - application/json
          - application/bson
        excludeContent:
          - application/xml
          - application/octet-stream
          - application/xml;charset=UTF-8
        methods:
          - "post"
          - "put"
          - "delete"
    severity: "medium"
    status: implemented
