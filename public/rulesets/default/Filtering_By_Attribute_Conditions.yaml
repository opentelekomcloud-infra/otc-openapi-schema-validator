rules:
  - id: "FIL-010-01-2507-2507-O"
    title: "Filter Parameter Check"
    message: Filter parameters must be the same if represented in response.
    option: optional
    location: path
    call:
      function: checkURIFilterParams
      functionParams:
        methods: ["get"]
    description: Check effective native path parameters against response 200 only, including Path Item, parameter, response and schema refs. Preserve JSON/problem+json then first-media selection, nested objects/items/maps/compositions, case-insensitive fallback and no-schema skip. Query parameters and other success statuses are not added to this rule.
    status: implemented
    severity: medium

