rules:
  - id: "COD-010-01-2507-2507-M"
    title: "Transmission Protocol Requirements"
    message: "All tenant-oriented APIs must use the HTTPS protocol."
    option: Mandatory
    location: file
    element: transport
    call:
      function: checkHttpsServers
      functionParams: {}
    description: Check effective Swagger schemes and OpenAPI servers, including operation/path overrides. Missing, empty or undetermined transport does not confirm HTTPS.
    severity: high
    status: implemented
